[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "flashhub-kernels"
version = "0.1.2"
description = "Client for loading CUDA kernel packages published on the flashhub CDN"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
dependencies = [
    "torch>=2.0",
]

[project.scripts]
flashhub-kernel-load = "flashhub_kernels.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
